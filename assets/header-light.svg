<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(0,0,0,0.06)"/></pattern>
  <linearGradient id="brand" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#a8860f"/><stop offset="0.55" stop-color="#5f8f1f"/><stop offset="1" stop-color="#1a8754"/></linearGradient>
  <linearGradient id="line" x1="12" x2="812" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a8860f" stop-opacity="0.25"/><stop offset="0.45" stop-color="#a8860f"/><stop offset="1" stop-color="#1a8754"/></linearGradient>
</defs>
<style>

.up { animation: up .7s cubic-bezier(.23,1,.32,1) both; }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
.rule { transform-origin: 12px 175px; animation: grow .7s cubic-bezier(.23,1,.32,1) .45s both; }
@keyframes grow { from { transform: scaleX(0); } }
.draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 2s cubic-bezier(.65,0,.35,1) .6s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.area { opacity: 0; animation: fade 1s ease 2.2s forwards; }
@keyframes fade { to { opacity: 1; } }
.node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
.ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ring 2.4s cubic-bezier(.23,1,.32,1) 2.7s infinite; }
@keyframes ring { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
.tag { opacity: 0; animation: tag 12s ease infinite; }
.t0 { animation-delay: .8s; } .t1 { animation-delay: 4.8s; } .t2 { animation-delay: 8.8s; }
@keyframes tag { 0% { opacity: 0; transform: translateY(6px); } 4%, 30% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; transform: translateY(-4px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<text class="up" x="12" y="62" font-size="14" font-weight="700" letter-spacing="3.5" fill="#1a8754">SÃO PAULO · REMOTE</text>
