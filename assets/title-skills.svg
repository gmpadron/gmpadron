<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="66" viewBox="0 0 1200 66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.07)"/></pattern>
  <linearGradient id="brand" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#d4b33a"/><stop offset="0.55" stop-color="#96c253"/><stop offset="1" stop-color="#4cc38a"/></linearGradient>
</defs>
<style>

.mark { transform-box: fill-box; transform-origin: center; animation: spin 1.2s cubic-bezier(.23,1,.32,1) both; }
@keyframes spin { from { transform: rotate(-90deg) scale(.6); opacity: 0; } }
.rule { transform-origin: 72px 50px; animation: grow 1.2s cubic-bezier(.23,1,.32,1) .2s both; }
@keyframes grow { from { transform: scaleX(0); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1200" height="66" rx="14" fill="#0d0f0e"/>

<g class="mark"><rect x="34" y="20" width="18" height="18" rx="2.5" transform="rotate(45 43 29)" fill="url(#brand)"/></g>
<text x="72" y="38" font-size="24" font-weight="700" fill="#f2f2ef">What I work with</text>

<rect class="rule" x="72" y="50" width="1094" height="1.5" fill="url(#brand)" opacity="0.5"/>

</svg>
