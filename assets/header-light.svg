<rect class="rule" x="12" y="174" width="56" height="3" rx="1.5" fill="url(#brand)"/>
<text class="tag t0" x="12" y="208" font-size="21" fill="#3d444d">Payments, reconciliation and invoicing that add up.</text>
<text class="tag t1" x="12" y="208" font-size="21" fill="#3d444d">I run what I ship: Docker, Linux, Cloudflare.</text>
<text class="tag t2" x="12" y="208" font-size="21" fill="#3d444d">React, Next.js and NestJS, interface to production.</text>
