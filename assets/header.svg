<linearGradient id="line" x1="60" x2="1140" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d4b33a" stop-opacity="0.25"/><stop offset="0.45" stop-color="#d4b33a"/><stop offset="1" stop-color="#4cc38a"/></linearGradient>
</defs>
<style>

.up { animation: up .7s cubic-bezier(.23,1,.32,1) both; }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
.rule { transform-origin: 60px 207px; animation: grow .7s cubic-bezier(.23,1,.32,1) .45s both; }
@keyframes grow { from { transform: scaleX(0); } }
.draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 2s cubic-bezier(.65,0,.35,1) .6s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.area { opacity: 0; animation: area 1s ease 2.2s forwards; }
@keyframes area { to { opacity: 1; } }
.node { opacity: 0; animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
.ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ring 2.4s cubic-bezier(.23,1,.32,1) 2.7s infinite; }
@keyframes ring { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
.tag { opacity: 0; animation: tag 12s ease infinite; }
.t0 { animation-delay: .8s; } .t1 { animation-delay: 4.8s; } .t2 { animation-delay: 8.8s; }
@keyframes tag { 0% { opacity: 0; transform: translateY(6px); } 4%, 30% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; transform: translateY(-4px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
